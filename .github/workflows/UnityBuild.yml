name: Unity 6 Web Build & Test 🚀

on:
  push:
    branches: [ "main", "Unity-CI-Testing" ] 
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Unity Build Job 🎮
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:

      # 1. 檢出你的專案程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false # 💡 Windows 上若沒特別裝 Git LFS，建議改為 false 加快速度

      # 2. 自動快取 Unity 專案的 Library 資料夾
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-

      # 3. 執行 Unity 測試 (如果專案內沒寫測試，這段執行完會直接跳過，是安全的)
      - name: Check Unity license for GitHub runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::No Unity license secret is configured for this GitHub runner. A Unity Personal license activated only in the local Hub is unavailable on ubuntu-latest."
            exit 1
          fi
      - name: Run PlayMode & EditMode Tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          GAME_CI_VERBOSE: 'true'
          UNITY_LICENSE: ${{ secrets.UNITY_SERIAL != '' && '' || secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.15f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # 4. 執行 Unity 建置
      - name: Upload Unity Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Test-Results
          path: artifacts
          if-no-files-found: warn
      - name: Build WebGL Target
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_SERIAL != '' && '' || secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.15f1
          targetPlatform: WebGL 

      # 5. 上傳建置好的成品
      - name: Upload Build Artifact 
        uses: actions/upload-artifact@v4
        with:
          name: Unity-WebGL-Build
          path: build/WebGL # Unity 6 預設打包路徑，如果打包失敗可以檢查專案設定
