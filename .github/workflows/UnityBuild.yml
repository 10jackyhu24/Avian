name: Unity 6 Tests

on:
  push:
    branches: ["main", "Unity-CI-Testing"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unity PlayMode & EditMode Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-

      - name: Check Unity license for GitHub runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]] 
          then
            echo "::error::Set UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for a paid license."
            exit 1
          fi

          if [[ -n "$UNITY_LICENSE" && ( -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ) ]] 
          then
            echo "::error::UNITY_LICENSE is set, but UNITY_EMAIL or UNITY_PASSWORD is missing. GameCI needs all three for Personal license activation."
            exit 1
          fi
        # run: | 底下是Bash 指令

        # 以下為Bash條件語法
        # if [[ conditions ]]
        # then
        #    code
        # elif [[ conditions ]]
        # then
        #    code
        # else
        #    code
        # fi

        # [[ 條件 ]], -z "$Variable" => Variable 是 空字串 成立, -n "$Variable" 不是空字串成立
        
        # echo "" github action 的報錯訊息，算是一種Log
        # exit 1 已失敗退出

      - name: Run PlayMode & EditMode Tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.15f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Test-Results
          path: artifacts
          if-no-files-found: warn
