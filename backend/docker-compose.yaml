name: avian-backend-services

services:
  avian-postgres:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${AVIAN_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  avian-lobby:
    build:
      context: ./lobby
    container_name: avian_lobby
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: avian-postgres
    depends_on:
      avian-postgres:
        condition: service_healthy

  avian-caddy:
    image: caddy:2.11.7
    container_name: avian_caddy
    restart: unless-stopped
    depends_on:
      - avian-lobby
      - avian-matchmaker
    environment:
      AVIAN_API_HOST: ${AVIAN_API_HOST:?Set AVIAN_API_HOST to the host public IP or domain}
      AVIAN_HTTPS_PORT: ${AVIAN_HTTPS_PORT:-8443}
      AVIAN_GAME_GATEWAY_HOST: ${AVIAN_GAME_GATEWAY_HOST:-avian-cluster-control-plane}
      AVIAN_ACME_CA: ${AVIAN_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "127.0.0.1:${AVIAN_HTTP_PORT:-8000}:8000"
      - "${AVIAN_HTTPS_PORT:-8443}:${AVIAN_HTTPS_PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - kind

  avian-matchmaker:
    build:
      context: ./matchmaker
    container_name: avian_matchmaker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROOM_MODE: ${ROOM_MODE:-static}
      WORLD_ENDPOINT: ${WORLD_ENDPOINT:-wss://${AVIAN_API_HOST}:${AVIAN_HTTPS_PORT:-8443}/game/30080}
      STATIC_ROOM_SEED: ${STATIC_ROOM_SEED:-100000}
      GAME_TRANSPORT: ${GAME_TRANSPORT:-websocket}
      ROOM_PUBLIC_BASE_URL: ${ROOM_PUBLIC_BASE_URL:-wss://${AVIAN_API_HOST}:${AVIAN_HTTPS_PORT:-8443}/game}
      ROOM_ENDPOINT_HOST: ${ROOM_ENDPOINT_HOST:-127.0.0.1}
      ROOM_NODE_PORT_START: ${ROOM_NODE_PORT_START:-30081}
      ROOM_NODE_PORT_END: ${ROOM_NODE_PORT_END:-30084}
      ROOM_IMAGE: ${ROOM_IMAGE:-avian-dedicated-server:v1}
      ROOM_NAMESPACE: ${ROOM_NAMESPACE:-default}
      ROOM_GAME_PORT: ${ROOM_GAME_PORT:-7777}
      ROOM_CLEANUP_GRACE_SECONDS: ${ROOM_CLEANUP_GRACE_SECONDS:-30}
      ROOM_CLEANUP_INTERVAL_SECONDS: ${ROOM_CLEANUP_INTERVAL_SECONDS:-10}
      KUBECONFIG: ${KUBECONFIG:-/kube/config}
      KUBERNETES_API_HOST: ${KUBERNETES_API_HOST:-}
      KUBERNETES_VERIFY_SSL: ${KUBERNETES_VERIFY_SSL:-true}
    ports:
      - "${AVIAN_MATCHMAKER_PORT:-8080}:8080"
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${USERPROFILE}/.kube/config}:/kube/config:ro

volumes:
  pgdata:
    driver: local
  caddy_data:
  caddy_config:

networks:
  kind:
    external: true
    name: kind
