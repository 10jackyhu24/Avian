name: avian-backend-services

services:
  avian-postgres:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  avian-lobby:
    build:
      context: ./lobby
    container_name: avian_lobby
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: avian-postgres
    depends_on:
      avian-postgres:
        condition: service_healthy

  avian-caddy:
    image: caddy:2
    container_name: avian_caddy
    restart: unless-stopped
    depends_on:
      - avian-lobby
      - avian-matchmaker
    ports:
      - "8000:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  avian-ngrok:
    image: ngrok/ngrok:latest
    container_name: avian_ngrok
    restart: unless-stopped
    depends_on:
      - avian-caddy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    command:
      - http
      - avian-caddy:8000

  avian-matchmaker:
    build:
      context: ./matchmaker
    container_name: avian_matchmaker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROOM_MODE: ${ROOM_MODE:-static}
      WORLD_ENDPOINT: ${WORLD_ENDPOINT:-127.0.0.1:30080}
      STATIC_ROOM_SEED: ${STATIC_ROOM_SEED:-}
      ROOM_ENDPOINT_HOST: ${ROOM_ENDPOINT_HOST:-127.0.0.1}
      ROOM_NODE_PORT_START: ${ROOM_NODE_PORT_START:-30081}
      ROOM_NODE_PORT_END: ${ROOM_NODE_PORT_END:-30084}
      ROOM_IMAGE: ${ROOM_IMAGE:-avian-dedicated-server:v1}
      ROOM_NAMESPACE: ${ROOM_NAMESPACE:-default}
      ROOM_GAME_PORT: ${ROOM_GAME_PORT:-7777}
      KUBECONFIG: ${KUBECONFIG:-/kube/config}
      KUBERNETES_API_HOST: ${KUBERNETES_API_HOST:-}
      KUBERNETES_VERIFY_SSL: ${KUBERNETES_VERIFY_SSL:-true}
    ports:
      - "8080:8080"
    volumes:
      - ${KUBECONFIG_HOST_PATH:-${USERPROFILE}/.kube/config}:/kube/config:ro

volumes:
  pgdata:
    driver: local
