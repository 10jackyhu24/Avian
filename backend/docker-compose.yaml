name: avian-backend-services

services:
  avian-postgres:
    image: postgres:15
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  avian-lobby:
    build:
      context: ./lobby
    container_name: avian_lobby
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: avian-postgres
    depends_on:
      avian-postgres:
        condition: service_healthy

  avian-ngrok:
    image: ngrok/ngrok:latest
    container_name: avian_ngrok
    restart: unless-stopped
    depends_on:
      - avian-lobby
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    command:
      - http
      - avian-lobby:8000

  avian-matchmaker:
    build:
      context: ./matchmaker
    container_name: avian_matchmaker
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
