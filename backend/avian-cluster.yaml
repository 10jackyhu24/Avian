# =======================================================
# Avian K8s cluster: world/game-room only
# =======================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avian-rooms-pool-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: avian-game-room
  template:
    metadata:
      labels:
        app: avian-game-room
    spec:
      containers:
      - name: game-room
        image: avian-world:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: world-service
spec:
  type: ClusterIP
  selector:
    app: avian-game-room
  ports:
  - name: http
    port: 5000
    targetPort: 5000
