# =======================================================
# Avian K8s cluster: world/game-room only
# =======================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avian-rooms-pool-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: avian-game-room
  template:
    metadata:
      labels:
        app: avian-game-room
    spec:
      containers:
      - name: game-room
        image: avian-dedicated-server:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7777
          protocol: UDP
        env:
        - name: GAME_PORT
          value: "7777"
        - name: MAP_SEED
          value: "100000"

---
apiVersion: v1
kind: Service
metadata:
  name: world-service
spec:
  type: NodePort
  selector:
    app: avian-game-room
  ports:
  - name: udp-game
    protocol: UDP
    port: 7777
    targetPort: 7777
    nodePort: 30080
