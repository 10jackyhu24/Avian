<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc">
  <title id="title">Avian 多人遊戲系統架構</title>
  <desc id="desc">三個等寬區塊由上而下為玩家端、後端系統、Docker 與 Kubernetes 部署。玩家透過 HTTP 使用帳號與配對服務，透過 Unity Transport UDP 連接遊戲伺服器。</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif; fill: #182638; }
      .panel { fill: #fff; stroke: #25364b; stroke-width: 3; rx: 12; }
      .node { fill: #f5f9fd; stroke: #8ca3b9; stroke-width: 2; rx: 9; }
      .client { fill: #eef5ff; stroke: #377dd2; }
      .api { fill: #edf8f3; stroke: #30926c; }
      .game { fill: #fff4ed; stroke: #da7942; }
      .infra { fill: #f8f6ff; stroke: #8a74bb; }
      .title { font-size: 25px; font-weight: 700; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .small { font-size: 14px; fill: #526579; }
      .wire { fill: none; stroke: #54718b; stroke-width: 2.5; marker-end: url(#arrow); }
      .http { stroke: #30926c; stroke-width: 3; }
      .udp { stroke: #da7942; stroke-width: 3; }
      .deploy { fill: none; stroke: #8a74bb; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#purpleArrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#54718b"/></marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8a74bb"/></marker>
  </defs>

  <text class="title" x="500" y="39" text-anchor="middle">Avian 多人遊戲：完整系統架構</text>

  <!-- Three equal-width main panels: x=60, width=880. -->
  <rect class="panel" x="60" y="60" width="880" height="160"/>
  <text class="section" x="85" y="94">① 玩家端</text>
  <rect class="node client" x="165" y="115" width="265" height="75"/>
  <text class="label" x="297" y="147" text-anchor="middle">Player A · Unity 客戶端</text>
  <text class="small" x="297" y="171" text-anchor="middle">UI、輸入、地圖與畫面</text>
  <rect class="node client" x="570" y="115" width="265" height="75"/>
  <text class="label" x="702" y="147" text-anchor="middle">Player B · Unity 客戶端</text>
  <text class="small" x="702" y="171" text-anchor="middle">UI、輸入、地圖與畫面</text>

  <rect class="panel" x="60" y="320" width="880" height="315"/>
  <!-- Both clients use the same two logical paths. -->
  <path d="M297 190 V238 H340" fill="none" stroke="#30926c" stroke-width="3"/>
  <path d="M702 190 V238 H340" fill="none" stroke="#30926c" stroke-width="3"/>
  <path class="wire http" d="M340 238 V377"/>
  <text class="small" x="200" y="263" fill="#30926c">HTTP(S)：登入、配對、選角</text>
  <path d="M297 190 V272 H745" fill="none" stroke="#da7942" stroke-width="3"/>
  <path d="M702 190 V272 H745" fill="none" stroke="#da7942" stroke-width="3"/>
  <path class="wire udp" d="M745 272 V377"/>
  <text class="small" x="625" y="296" fill="#da7942">Unity Transport／UDP：遊戲同步</text>

  <text class="section" x="85" y="354">② 後端系統</text>
  <rect class="node api" x="210" y="380" width="245" height="80"/>
  <text class="label" x="332" y="412" text-anchor="middle">Caddy · HTTP 入口</text>
  <text class="small" x="332" y="438" text-anchor="middle">/auth → Lobby　/match → Matchmaker</text>
  <rect class="node api" x="130" y="505" width="220" height="84"/>
  <text class="label" x="240" y="538" text-anchor="middle">Lobby · FastAPI</text>
  <text class="small" x="240" y="564" text-anchor="middle">帳號與 Session</text>
  <rect class="node api" x="395" y="505" width="220" height="84"/>
  <text class="label" x="505" y="538" text-anchor="middle">Matchmaker · FastAPI</text>
  <text class="small" x="505" y="564" text-anchor="middle">配對、房間與角色準備</text>
  <rect class="node api" x="130" y="598" width="220" height="25"/>
  <text class="small" x="240" y="616" text-anchor="middle">PostgreSQL：帳號／Session</text>
  <rect class="node game" x="650" y="380" width="220" height="209"/>
  <text class="label" x="760" y="416" text-anchor="middle">Unity 專用伺服器</text>
  <text class="small" x="760" y="449" text-anchor="middle">ServerBootstrap</text>
  <text class="small" x="760" y="478" text-anchor="middle">玩家、敵人、戰鬥、物品</text>
  <text class="small" x="760" y="507" text-anchor="middle">伺服器驗證與同步</text>
  <text class="small" x="760" y="550" text-anchor="middle">監聽 7777／UDP</text>
  <path class="wire" d="M290 460 L240 505"/>
  <path class="wire" d="M400 460 L505 505"/>
  <path class="wire" d="M240 589 V598"/>

  <rect class="panel" x="60" y="705" width="880" height="260"/>
  <text class="small" x="500" y="675" text-anchor="middle">部署關係（虛線）：後端 API 在 Docker Compose；遊戲伺服器在 Kind／Kubernetes</text>
  <path class="deploy" d="M310 713 V648 H330 V635"/>
  <path class="deploy" d="M765 713 V640 H765 V589"/>

  <text class="section" x="85" y="739">③ Docker 與 Kubernetes 部署</text>
  <rect class="node infra" x="110" y="765" width="370" height="165"/>
  <text class="label" x="295" y="798" text-anchor="middle">Docker Compose</text>
  <text class="small" x="295" y="826" text-anchor="middle">ngrok → Caddy :8000</text>
  <text class="small" x="295" y="851" text-anchor="middle">Lobby、Matchmaker、PostgreSQL</text>
  <text class="small" x="295" y="895" text-anchor="middle">HTTP 入口與帳號／配對服務</text>
  <rect class="node infra" x="520" y="765" width="370" height="165"/>
  <text class="label" x="705" y="798" text-anchor="middle">Kind／Kubernetes</text>
  <text class="small" x="705" y="826" text-anchor="middle">k8s：每場 Job／Pod ＋ UDP NodePort Service</text>
  <text class="small" x="705" y="851" text-anchor="middle">static：預先部署的 Deployment／Service</text>
  <text class="small" x="705" y="895" text-anchor="middle">NodePort 30080–30084 → Pod 7777／UDP</text>
  <text class="small" x="500" y="994" text-anchor="middle">Matchmaker 在 k8s 模式透過 Kubernetes API 建立房間；玩家取得 world_endpoint 後直接連至 UDP NodePort。</text>
</svg>
